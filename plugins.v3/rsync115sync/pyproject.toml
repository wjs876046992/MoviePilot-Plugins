[project]
name = "rsync115sync"
# 本清单只承载依赖，不承载插件版本：
# 按 docs/Repository_Guide.md，V3 插件清单用 dynamic = ["version"]，
# 真实版本由插件类的 plugin_version 与 package.v3.json 维护（当前 v0.0.12）。
# 此前此处残留静态 version = "0.0.3"，与插件版本长期不一致，已移除以免误导。
dynamic = ["version"]
description = "需依赖 CloudDrive2 (CD2) 将 115 网盘挂载到本地宿主机并映射至 MoviePilot 容器。通过 rsync 同步本地文件到 CD2 挂载的 115 网盘，支持入库冷却延迟、双向对账及命令定向重试"
authors = [{ name = "HermanWu" }]
dependencies = []
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/wjs876046992/MoviePilot-Plugins"
Repository = "https://github.com/wjs876046992/MoviePilot-Plugins"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
